name: DJNFitnessCoach
options:
  bundleIdPrefix: com.djn
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.djn.fitness-coach
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  DJNFitnessCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources/DJNFitnessCoach
    resources:
      - path: Sources/DJNFitnessCoach/Resources
    info:
      path: Sources/DJNFitnessCoach/Info.plist
      properties:
        CFBundleName: DJN Coach
        CFBundleDisplayName: DJN Coach
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSHealthShareUsageDescription: "DJN Coach reads workout and health data to enhance your training insights."
        NSHealthUpdateUsageDescription: "DJN Coach writes workout data to Apple Health."
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
